name: Import DUEL ARENA v77

on:
  push:
    paths:
      - ".github/workflows/import-duel-arena.yml"
      - "VERIFY-SHA256.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download exact published dist files and verify SHA-256
        env:
          BASE_URL: https://duel-arena.nagisa793.chatgpt.site
        run: |
          python3 - <<'PY'
          import hashlib, json, os, sys, urllib.parse, urllib.request
          from pathlib import Path

          base = os.environ["BASE_URL"].rstrip("/")
          with open("VERIFY-SHA256.json", "r", encoding="utf-8") as f:
              manifest = json.load(f)["files"]

          dist_items = [(rel, sha) for rel, sha in manifest.items() if rel.startswith("dist/") and rel != "dist/index.html"]
          print(f"Downloading {len(dist_items)} dist files from {base}")

          for i, (rel, expected) in enumerate(dist_items, 1):
              public_path = rel[len("dist/"):]
              url = base + "/" + urllib.parse.quote(public_path, safe="/")
              dest = Path(rel)
              dest.parent.mkdir(parents=True, exist_ok=True)
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=120) as r, open(dest, "wb") as out:
                      out.write(r.read())
              except Exception as e:
                  print(f"FAILED {rel}: {e}", file=sys.stderr)
                  sys.exit(1)

              actual = hashlib.sha256(dest.read_bytes()).hexdigest()
              if actual != expected:
                  print(f"SHA256 MISMATCH {rel}", file=sys.stderr)
                  print(f" expected: {expected}", file=sys.stderr)
                  print(f" actual:   {actual}", file=sys.stderr)
                  sys.exit(1)
              print(f"[{i}/{len(dist_items)}] OK {rel}")

          print("All published dist files match VERIFY-SHA256.json")
          PY

      - name: Recover exact original index from hosted HTML
        env:
          BASE_URL: https://duel-arena.nagisa793.chatgpt.site
        run: |
          python3 - <<'PY'
          import hashlib, os, sys, urllib.request
          from pathlib import Path

          expected = "500005797f4d4cfa535bdb237c5c95b0da7a0884bd78456331a324b8ccec2778"
          original_size = 17545
          url = os.environ["BASE_URL"].rstrip("/") + "/index.html"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          data = urllib.request.urlopen(req, timeout=120).read()
          print("hosted index bytes:", len(data), "extra:", len(data)-original_size)

          if hashlib.sha256(data).hexdigest() == expected:
              recovered=data
          else:
              recovered=None
              delta=len(data)-original_size
              if delta >= 0:
                  # Most hosting transformations are one injected contiguous block.
                  for i in range(0, len(data)-delta+1):
                      cand=data[:i]+data[i+delta:]
                      if len(cand)==original_size and hashlib.sha256(cand).hexdigest()==expected:
                          print("Recovered by removing one injected block:", i, delta)
                          recovered=cand
                          break
                  # Also try a prefix/suffix split whose total equals the size delta.
                  if recovered is None:
                      for pre in range(delta+1):
                          post=delta-pre
                          cand=data[pre:len(data)-post if post else None]
                          if len(cand)==original_size and hashlib.sha256(cand).hexdigest()==expected:
                              print("Recovered by trimming prefix/suffix:", pre, post)
                              recovered=cand
                              break

          if recovered is None:
              print("Could not reconstruct exact original index from hosted transformation.", file=sys.stderr)
              print("hosted sha256:", hashlib.sha256(data).hexdigest(), file=sys.stderr)
              sys.exit(1)

          Path("dist").mkdir(exist_ok=True)
          Path("dist/index.html").write_bytes(recovered)
          print("Exact index recovered:", hashlib.sha256(recovered).hexdigest())
          PY

      - name: Verify imported published runtime files
        run: |
          python3 - <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          with open("VERIFY-SHA256.json", "r", encoding="utf-8") as f:
              manifest = json.load(f)["files"]

          targets = [(rel, sha) for rel, sha in manifest.items()
                     if rel.startswith("dist/") and rel != "dist/index.html"]
          bad = []
          for rel, expected in targets:
              p = Path(rel)
              if not p.is_file():
                  bad.append((rel, expected, "MISSING"))
                  continue
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              if actual != expected:
                  bad.append((rel, expected, actual))

          if bad:
              print("Runtime verification failed:", file=sys.stderr)
              for rel, exp, act in bad:
                  print(rel, exp, act, file=sys.stderr)
              sys.exit(1)

          print(f"Verified {len(targets)} / {len(targets)} imported runtime files.")
          PY

      - name: Verify complete exported set except standalone regression harness
        run: |
          python3 - <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          with open("VERIFY-SHA256.json","r",encoding="utf-8") as f:
              manifest=json.load(f)["files"]
          excluded={"tests/rules-regression.cjs"}
          bad=[]
          for rel,expected in manifest.items():
              if rel in excluded:
                  continue
              p=Path(rel)
              if not p.is_file():
                  bad.append((rel,expected,"MISSING"))
                  continue
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              if actual != expected:
                  bad.append((rel,expected,actual))
          if bad:
              print("Full-set verification failed:",file=sys.stderr)
              for row in bad: print(*row,file=sys.stderr)
              sys.exit(1)
          print(f"Verified {len(manifest)-len(excluded)} / {len(manifest)} original ZIP files exactly.")
          PY

      - name: Commit imported runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "No runtime changes to commit."
            exit 0
          fi
          git commit -m "Import DUEL ARENA v77 runtime from published Site"
          git push

      - name: Publish updated game to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
